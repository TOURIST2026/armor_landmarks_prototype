<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>装甲板模板标点</title><style>
body{font:16px system-ui;margin:0;background:#101722;color:#e5edf6}main{max-width:1120px;margin:auto;padding:28px}h1{font-size:25px}button,select,input{font:inherit;padding:8px;border-radius:6px;margin:4px;border:1px solid #455369}button{cursor:pointer;background:#dbeafe}canvas{width:min(70vw,650px);height:auto;background:#fff;image-rendering:pixelated;touch-action:none;cursor:crosshair} .grid{display:flex;gap:24px;align-items:flex-start}aside{flex:1;min-width:220px}li{padding:7px;cursor:pointer;border-bottom:1px solid #344054}.selected{background:#254367}p{line-height:1.6}.warning{color:#ffd58a}#status{color:#93e7bd}@media(max-width:800px){.grid{display:block}canvas{width:100%}} small{color:#b1c0d0}
</style><main><h1>固定模板 · 关键点标注</h1>
<p class="warning">当前点位是用于跑通程序的草稿。请按你们的物理点编号核对；本页面不生成物理坐标。</p>
<select id="classes"></select><button id="add">添加点模式</button><button id="remove">删除选中点</button><button id="undo">撤销</button>
<div class="grid"><canvas id="canvas" width="700" height="650"></canvas><aside><strong>固定点编号与模板像素坐标</strong><ol id="points"></ol><p>先点右侧条目，再点击图片可移动该点。点“添加点模式”后点击图片增加点，最多 12 个。删除不会重编号。</p><label>选中点 ID<input id="pointid" type="number" min="0" style="width:80px"></label><button id="rename">修改 ID</button></aside></div>
<p><label><input type="checkbox" id="reviewed">我已核对所有类别的点位和编号，与项目约定一致</label></p>
<button id="save">下载 config.json</button><label>载入已有标注 <input id="load" type="file" accept=".json"></label><p id="status"></p>
<small>下载后用 config.json 替换项目 templates/config.json。网页为本地静态工具，数据不会上传；重新生成页面：python tools/make_annotation_page.py。</small>
</main><script>
let config=__CONFIG__;const imageSources=__IMAGES__;const images=imageSources.map(src=>{let i=new Image();i.src=src;return i});
let cid=0,selected=0,adding=false,history=[];const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');
function snapshot(){history.push(JSON.stringify(config));if(history.length>50)history.shift();config.annotations_status='draft';$('reviewed').checked=false;}
function message(t){$('status').textContent=t}
function rebuild(){const select=$('classes');select.textContent='';for(const c of config.classes){let o=document.createElement('option');o.value=c.id;o.textContent=c.id+' · '+c.name;select.append(o)}select.value=cid;draw()}
function draw(){let im=images[cid];if(!im.complete||!im.naturalWidth)return;canvas.width=700;canvas.height=Math.round(700*im.naturalHeight/im.naturalWidth);ctx.imageSmoothingEnabled=false;ctx.drawImage(im,0,0,canvas.width,canvas.height);let sx=canvas.width/im.naturalWidth,sy=canvas.height/im.naturalHeight;let list=$('points');list.textContent='';config.classes[cid].points.forEach((p,index)=>{let x=(p.xy[0]+.5)*sx,y=(p.xy[1]+.5)*sy;ctx.strokeStyle=index===selected?'#ffb000':'#00f4bb';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.moveTo(x-12,y);ctx.lineTo(x+12,y);ctx.moveTo(x,y-12);ctx.lineTo(x,y+12);ctx.stroke();ctx.font='bold 18px system-ui';ctx.fillStyle='#ff3355';ctx.fillText(p.id,x+10,y-10);let li=document.createElement('li');li.textContent='ID '+p.id+'  ('+p.xy.map(n=>n.toFixed(2)).join(', ')+')';li.className=index===selected?'selected':'';li.onclick=()=>{selected=index;adding=false;draw()};list.append(li)});let point=config.classes[cid].points[selected];$('pointid').value=point?point.id:'';$('add').textContent=adding?'正在添加：点击图片':'添加点模式'}
images.forEach(i=>i.onload=draw);$('classes').onchange=e=>{cid=Number(e.target.value);selected=0;adding=false;draw()};
canvas.onclick=e=>{let rect=canvas.getBoundingClientRect(),im=images[cid];let x=(e.clientX-rect.left)/rect.width*im.naturalWidth-.5,y=(e.clientY-rect.top)/rect.height*im.naturalHeight-.5;x=Math.max(0,Math.min(im.naturalWidth-1,x));y=Math.max(0,Math.min(im.naturalHeight-1,y));let pts=config.classes[cid].points;if(adding&&pts.length>=config.max_points){message('已达到最大点数');return}snapshot();if(adding){pts.push({id:Math.max(-1,...pts.map(p=>p.id))+1,xy:[x,y]});selected=pts.length-1;adding=false}else if(pts[selected]){pts[selected].xy=[x,y]}draw()};
$('add').onclick=()=>{adding=true;draw()};$('remove').onclick=()=>{if(config.classes[cid].points[selected]){snapshot();config.classes[cid].points.splice(selected,1);selected=0;draw()}};
$('undo').onclick=()=>{if(history.length){config=JSON.parse(history.pop());$('reviewed').checked=config.annotations_status==='reviewed';selected=0;rebuild()}};
$('rename').onclick=()=>{let n=Number($('pointid').value),pts=config.classes[cid].points;if(!Number.isInteger(n)||n<0||pts.some((p,i)=>i!==selected&&p.id===n)){message('ID 必须是唯一非负整数');return}if(pts[selected]){snapshot();pts[selected].id=n;draw()}};
$('save').onclick=()=>{if(config.classes.some(c=>c.points.length<4)){message('每个类别至少四个点');return}config.annotations_status=$('reviewed').checked?'reviewed':'draft';let blob=new Blob([JSON.stringify(config,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='config.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('已下载。请替换 templates/config.json；已训练模型仍保留旧点定义，修改后需要重新训练。')};
$('load').onchange=async e=>{try{let incoming=JSON.parse(await e.target.files[0].text());if(incoming.classes.length!==images.length||incoming.classes.some((c,i)=>c.id!==i||!Array.isArray(c.points)))throw Error('类别结构不匹配');snapshot();config=incoming;cid=0;selected=0;$('reviewed').checked=config.annotations_status==='reviewed';rebuild();message('已载入')}catch(err){message('载入失败：'+err.message)}};rebuild();
</script></html>
